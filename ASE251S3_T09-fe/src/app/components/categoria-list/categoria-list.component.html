<div class="card">
  <h2 style="text-align:center">Listado de Categorías</h2>
  <table style="width:100%; text-align:center;">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let categoria of categorias">
        <td>{{ categoria.id }}</td>
        <td>{{ categoria.nombre }}</td>
        <td>
          <button (click)="onEditar(categoria)">Editar</button>
          <button (click)="onEliminar(categoria.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
