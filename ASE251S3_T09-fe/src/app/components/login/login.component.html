<div class="login-page">

  <div class="login-card">

    <!-- Header verde -->
    <div class="login-header">
      <h1>AGRÍCOLA FLOREZA</h1>
      <p>Sistema de Gestión Agrícola</p>
    </div>

    <!-- Formulario -->
    <div class="login-body">

      <!-- Error global -->
      <div class="alert-error" *ngIf="errorMsg">
        <span class="alert-icon">⚠️</span>
        {{ errorMsg }}
      </div>

      <!-- Email -->
      <div class="field-group">
        <label for="email">Usuario o Correo</label>
        <input
          id="email"
          type="email"
          placeholder="ejemplo@floreza.com"
          [(ngModel)]="email"
          [class.input-error]="emailError"
          autocomplete="email"
          (blur)="validarCampos()"
        />
        <span class="field-error" *ngIf="emailError">{{ emailError }}</span>
      </div>

      <!-- Contraseña -->
      <div class="field-group">
        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input
            id="password"
            [type]="mostrarPassword ? 'text' : 'password'"
            placeholder="5 dígitos numéricos"
            [(ngModel)]="password"
            [class.input-error]="passwordError"
            (keydown)="soloDigitos($event)"
            (ngModelChange)="onPasswordChange()"
            maxlength="5"
            autocomplete="current-password"
          />
          <button class="toggle-pass" type="button" (click)="togglePassword()" tabindex="-1">
            {{ mostrarPassword ? '🙈' : '👁️' }}
          </button>
        </div>
        <span class="field-error" *ngIf="passwordError">{{ passwordError }}</span>
      </div>

      <!-- Recordar sesión -->
      <div class="remember-row">
        <label class="check-label">
          <input type="checkbox" [(ngModel)]="recordar" />
          <span>Recordar sesión</span>
        </label>
      </div>

      <!-- Botón Iniciar Sesión -->
      <button
        class="btn-login"
        (click)="iniciarSesion()"
        [disabled]="cargando"
      >
        <span *ngIf="!cargando">Iniciar Sesión</span>
        <span *ngIf="cargando" class="spinner">⏳ Verificando...</span>
      </button>

    </div>

    <!-- Footer -->
    <div class="login-footer">
      <p>© 2026 Agrícola Floreza. Todos los derechos reservados.</p>
    </div>

  </div>

</div>
