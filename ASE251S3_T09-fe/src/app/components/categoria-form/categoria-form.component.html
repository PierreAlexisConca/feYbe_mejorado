<div class="card">
  <h2>{{ modelo.id ? 'Editar Categoría' : 'Nueva Categoría' }}</h2>
  <form (ngSubmit)="onSubmit()">
    <div>
      <label>Nombre:</label>
      <input type="text" [(ngModel)]="modelo.nombre" name="nombre" required />
    </div>
    <button type="submit">{{ modelo.id ? 'Actualizar' : 'Registrar' }} Categoría</button>
    <button type="button" (click)="onCancelar()">Limpiar</button>
  </form>
</div>
