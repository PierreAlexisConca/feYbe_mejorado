<div class="customers-container">

  <div class="title-section">
    <div>
      <h2>Clientes</h2>
      <p>Gestión de clientes e historial de compras</p>
      <div *ngIf="mensaje" class="toast" [class.toast-error]="tipoMensaje === 'error'">{{ mensaje }}</div>
    </div>
    <div class="action-buttons">
      <button class="add-btn" (click)="toggleForm()">
        {{ showForm ? 'Cancelar' : '+ Agregar cliente' }}
      </button>
    </div>
  </div>

  <div class="form-section" *ngIf="showForm">
    <input [(ngModel)]="newCustomer.nombre" placeholder="Nombre completo">
    <input [(ngModel)]="newCustomer.email" placeholder="Correo">
    <input [(ngModel)]="newCustomer.telefono" placeholder="Número">

    <button class="save-btn" (click)="guardar()">
      {{ editando ? 'Actualizar' : 'Guardar' }}
    </button>
  </div>

  <div class="search-section">
    <div class="search-with-filters">
      <input
        [(ngModel)]="searchText"
        placeholder="Buscar por nombre, correo o número..."
      />
      <div class="filter-buttons">
        <button 
          [class.active]="filterType === 'todos'" 
          (click)="filterType = 'todos'"
        >
          Todos
        </button>
        <button 
          [class.active]="filterType === 'frecuentes'" 
          (click)="filterType = 'frecuentes'"
        >
          👥 Frecuentes
        </button>
        <button 
          [class.active]="filterType === 'normales'" 
          (click)="filterType = 'normales'"
        >
          📊 Normales
        </button>
      </div>
      <label class="toggle-inactive" [class.active]="showInactive">
        <input type="checkbox" [(ngModel)]="showInactive" />
        <span>Ver inactivos</span>
      </label>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Teléfono</th>
        <th>Tipo</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let customer of filtrados" [class.frecuente]="clientesFrecuentes.includes(customer)" [class.activo]="esClienteActivo(customer)" [class.inactivo]="!esClienteActivo(customer)">
        <td>{{ customer.nombre }}</td>
        <td>{{ customer.email }}</td>
        <td>{{ customer.telefono }}</td>
        <td>
          <span *ngIf="clientesFrecuentes.includes(customer)" class="badge-frecuente">⭐ Frecuente</span>
          <span *ngIf="clientesNormales.includes(customer)" class="badge-normal">Regular</span>
        </td>
        <td>
          <span *ngIf="esClienteActivo(customer)" class="badge-active">🟢 Activo</span>
          <span *ngIf="!esClienteActivo(customer)" class="badge-inactive">🔴 Inactivo</span>
        </td>
        <td>
          <button class="edit-btn" (click)="editar(customer)">Editar</button>
          <button class="delete-btn" *ngIf="esClienteActivo(customer)" (click)="eliminar(customer)">Eliminar</button>
          <button class="restore-btn" *ngIf="!esClienteActivo(customer)" (click)="restaurar(customer)">Restaurar</button>
        </td>
      </tr>
    </tbody>
  </table>

</div>
