server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy hacia el backend
    # El host/IP se inyecta en tiempo de arranque del contenedor via variable de entorno BACKEND_HOST.
    # Ejemplos:
    #   Local Pierre/Massiel : BACKEND_HOST=springboot-sqlserver
    #   Local Joseph         : BACKEND_HOST=joseph-backend
    #   EC2 misma red Docker : BACKEND_HOST=springboot-backend
    #   EC2 separada (VPC)   : BACKEND_HOST=10.0.2.149   ← IP privada de la EC2 del backend
    location /api {
        proxy_pass http://${BACKEND_HOST}:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Angular — redirige todo al index.html para que el router funcione
    location / {
        try_files $uri $uri/ /index.html;
    }
}
