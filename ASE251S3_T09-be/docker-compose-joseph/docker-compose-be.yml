version: '3'

services:
  api:
    image: joseph2307/springboot-sqlserver:1.0
    container_name: springboot-sqlserver
    ports:
      - "8087:8087"
    environment:
      - PORT=8087
      - SERVER_URL=http://localhost:8087
      - CORS_ALLOWED_ORIGINS=http://localhost:4200        # <-- cambia esto por la IP/dominio del frontend
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver:1433;databaseName=agro_db;encrypt=true;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=Alexis123!
    networks:
      - my-network

networks:
  my-network:
    external: true

